name: Release desktop app

on:
  workflow_dispatch:

# Builds only need to read the repository. The release job elevates this below.
permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    # A release must come from the protected default branch, not an arbitrary
    # ref selected in the manual-dispatch UI.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri.conf.json beforeBuildCommand uses bun; lockfile is bun.lock
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build desktop app
        run: bun run tauri:build

      # Workspace Cargo.toml puts release output under the repo-root target/
      # (older layouts used crates/application/src-tauri/target).
      - name: Locate bundle artifacts
        id: bundle
        shell: bash
        run: |
          for candidate in \
            target/release/bundle \
            crates/application/src-tauri/target/release/bundle
          do
            if [ -d "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Found bundle at $candidate"
              find "$candidate" -type f | head -100
              exit 0
            fi
          done
          echo "No Tauri bundle directory found" >&2
          find . -type d -name bundle 2>/dev/null | head -50 || true
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundles
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-bundles"
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AMARCODE Latest
          body: |
            Automated desktop release generated from the workflow button.
          make_latest: true
          overwrite_files: true
          files: release-artifacts/**
