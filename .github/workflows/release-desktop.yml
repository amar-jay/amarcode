name: Release desktop app

on:
  workflow_dispatch:

# Builds only need to read the repository. The release job elevates this below.
permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    # A release must come from the protected default branch, not an arbitrary
    # ref selected in the manual-dispatch UI.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri.conf.json beforeBuildCommand uses bun; lockfile is bun.lock
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd crates/application test -- --passWithNoTests

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build desktop app
        run: bun run tauri:build

      # Workspace Cargo.toml puts release output under the repo-root target/
      # (older layouts used crates/application/src-tauri/target).
      #
      # Note: GH Actions runs bash with `pipefail`. `find | head` then fails with
      # "Broken pipe" once head closes the pipe — even when the bundle exists.
      - name: Locate bundle artifacts
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          for candidate in \
            target/release/bundle \
            crates/application/src-tauri/target/release/bundle
          do
            if [ -d "$candidate" ]; then
              # Prefer shippable installers over intermediate AppDir trees.
              mapfile -t files < <(
                find "$candidate" -type f \
                  \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                     -o -name '*.dmg' -o -name '*.app.tar.gz' \
                     -o -name '*.msi' -o -name '*.exe' -o -name '*.nsis.zip' \) \
                  2>/dev/null | sort
              )

              if [ "${#files[@]}" -eq 0 ]; then
                mapfile -t files < <(find "$candidate" -type f 2>/dev/null | sort | head -n 100 || true)
              fi

              if [ "${#files[@]}" -eq 0 ]; then
                echo "Bundle directory exists but is empty: $candidate" >&2
                continue
              fi

              {
                echo "path=$candidate"
                echo "count=${#files[@]}"
              } >> "$GITHUB_OUTPUT"

              echo "Found bundle at $candidate (${#files[@]} file(s)):"
              printf '  %s\n' "${files[@]}"
              exit 0
            fi
          done

          echo "No Tauri bundle directory found" >&2
          # Diagnostic only — never let a broken pipe fail the job here.
          find . -type d -name bundle 2>/dev/null | head -n 50 || true
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundles
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-bundles"
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: amarcode Latest
          body: |
            Automated desktop release generated from the workflow button.
          make_latest: true
          overwrite_files: true
          files: release-artifacts/**
