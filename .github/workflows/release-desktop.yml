name: Release desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform }}
    # Creating the version tag and GitHub release requires a write-capable
    # GITHUB_TOKEN. Keep the workflow default read-only and grant write access
    # only to the job that publishes release assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd crates/application test -- --passWithNoTests

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Test Windows task state queries
        if: matrix.platform == 'windows-latest'
        run: powershell -NoProfile -File scripts/test-windows-task-status.ps1

      - name: Build and publish signed desktop release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/application
          tagName: latest
          releaseName: amarcode desktop
          releaseBody: |
            Signed Amarcode desktop release.

            Existing installations receive this release when the signed
            updater artifacts change, even if the package version is unchanged.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
