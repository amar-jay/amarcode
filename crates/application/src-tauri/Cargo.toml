[package]
name = "amarcode"
version = "0.1.0"
description = "A desktop workspace for ACP coding agents"
authors = ["amarjay <abdelmanan.abdelrahman@gmail.com>"]
edition = "2021"

[lib]
name = "amarcode_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amarcode-protocol = { path = "../../protocol" }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
