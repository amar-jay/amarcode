[package]
name = "amarcode-protocol"
version = "0.1.0"
description = "Shared wire contract for Amarcode clients and daemon"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[[bin]]
name = "generate-protocol-types"
path = "src/bin/generate-types.rs"
