<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live desk styleframes</title>
    <style>
      @font-face {
        font-family: Cormorant;
        src: url("../public/fonts/cormorant-garamond-400.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: Roboto;
        src: url("../public/fonts/roboto-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html.solo,
      html.solo body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fcfcfc;
      }
      html.solo .sheet {
        width: 1920px;
        padding: 0;
        gap: 0;
      }
      html.solo figure {
        gap: 0;
      }
      html.solo figcaption {
        display: none;
      }
      body {
        background: #d9ddd4;
        color: #242c2b;
        font-family: Cormorant, serif;
      }
      .sheet {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 28px;
        width: 1976px;
      }
      figure { display: flex; flex-direction: column; gap: 10px; }
      figcaption {
        font-family: Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5b6561;
      }
      .frame {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #fcfcfc;
      }
      .ui {
        position: absolute;
        inset: 0;
        background: url("/home/manan/Pictures/Screenshots/Screenshot From 2026-10-20 20-09-00.png") center / cover no-repeat;
      }
      .push {
        transform: scale(1.35);
        transform-origin: 68% 58%;
      }
      .label {
        position: absolute;
        left: 36px;
        bottom: 32px;
        max-width: 760px;
        padding: 14px 22px;
        background: #fafaf6ee;
        border: 1px solid #d5d9d0;
        font-size: 34px;
        letter-spacing: -0.4px;
        line-height: 1.15;
      }
      .end {
        background: #fafaf6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .end img { width: 96px; height: 96px; border-radius: 16px; }
      .end h1 { font-size: 92px; font-weight: 400; letter-spacing: -2.4px; }
      .end p {
        font-family: Roboto, sans-serif;
        font-size: 28px;
        color: #5b6561;
        letter-spacing: 0.4px;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <figure>
        <figcaption>Live desk 01 — open on the chat</figcaption>
        <div class="frame" id="open">
          <div class="ui"></div>
          <div class="label">One conversation. Several agents.</div>
        </div>
      </figure>
      <figure>
        <figcaption>Live desk 02 — push in on the commands</figcaption>
        <div class="frame" id="push">
          <div class="ui push"></div>
          <div class="label">Git history stays in the same chat.</div>
        </div>
      </figure>
      <figure>
        <figcaption>Live desk 03 — logo and URL</figcaption>
        <div class="frame end" id="end">
          <img src="../public/brand/app-icon.svg" alt="" />
          <h1>amarcode</h1>
          <p>amarcode.amarjay.com</p>
        </div>
      </figure>
    </main>
    <script>
      const frame = new URLSearchParams(location.search).get("frame");
      if (frame) {
        document.documentElement.classList.add("solo");
        for (const figure of document.querySelectorAll("figure")) {
          if (!figure.querySelector("#" + frame)) figure.remove();
        }
      }
    </script>
  </body>
</html>
