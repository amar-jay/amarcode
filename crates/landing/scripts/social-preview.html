<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Amarcode social preview source</title>
  </head>
  <body
    class="relative m-0 h-[630px] w-[1200px] overflow-hidden bg-paper font-serif text-ink"
  >
    <img
      src="/images/misty-mountains.webp"
      alt=""
      class="absolute inset-0 size-full object-cover opacity-20"
    />
    <div class="absolute inset-x-12 top-0 h-full border-x border-rule"></div>
    <div class="absolute inset-x-0 top-[112px] border-t border-rule"></div>
    <div class="absolute inset-x-0 bottom-[70px] border-t border-rule"></div>
    <header class="relative flex h-[112px] items-center gap-3 px-[76px]">
      <img src="/images/app/amarcode-logo.svg" alt="" class="size-10" />
      <span class="text-[36px] tracking-[-1px]">amarcode</span>
      <span class="ml-auto text-[19px]"
        >A workspace for your coding agents</span
      >
    </header>
    <main class="relative flex gap-10 px-[76px] pt-[45px]">
      <div class="w-[490px] shrink-0">
        <h1
          class="mb-6 text-[76px] leading-[0.98] font-light tracking-[-0.04em]"
        >
          Your agents.<br />One continuous<br /><em>conversation.</em>
        </h1>
        <p class="max-w-[390px] text-[24px] leading-[1.35]">
          Keep the conversation, even when you change who you’re working with.
        </p>
      </div>
      <div
        class="relative mt-2 h-[348px] w-[510px] shrink-0 overflow-hidden border border-rule shadow-lg"
      >
        <img
          src="/images/app/amarcode-light.png"
          alt=""
          class="absolute inset-0 size-full object-cover object-left-top"
        />
        <img
          src="/images/app/amarcode-dark.png"
          alt=""
          class="absolute inset-0 size-full object-cover object-left-top [clip-path:inset(0_50%_0_0)]"
        />
        <span class="absolute inset-y-0 left-1/2 border-l border-paper"></span>
      </div>
    </main>
    <footer
      class="absolute inset-x-[76px] bottom-[22px] flex items-center justify-between text-[18px]"
    >
      <span>Many agents. Your conversation.</span>
      <div class="flex items-center gap-6">
        <img src="/images/agents/claude-acp.svg" alt="Claude" class="size-5" />
        <img src="/images/agents/codex-acp.svg" alt="Codex" class="size-5" />
        <img src="/images/agents/gemini.svg" alt="Gemini" class="size-5" />
        <img src="/images/agents/cursor.svg" alt="Cursor" class="size-5" />
        <span>Built on ACP</span>
      </div>
    </footer>
  </body>
</html>
