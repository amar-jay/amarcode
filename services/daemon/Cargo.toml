[package]
name = "acp-workbench-daemon"
version = "0.1.0"
description = "Background service for ACP Workbench"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
