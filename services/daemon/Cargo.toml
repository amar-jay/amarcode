[package]
name = "acp-workbench-daemon"
version = "0.1.0"
description = "Background service for ACP Workbench"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["sync-secret-service", "apple-native"] }
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "process", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
