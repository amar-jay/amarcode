[package]
name = "acp-workbench"
version = "0.1.0"
description = "A desktop workspace for ACP coding agents"
authors = ["ACP Workbench"]
edition = "2021"

[lib]
name = "acp_workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["sync-secret-service", "apple-native"] }
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

